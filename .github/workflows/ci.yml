name: VaaniDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaanidesk_test
          POSTGRES_PASSWORD: vaanidesk_test_password
          POSTGRES_DB: vaanidesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaanidesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-not-for-production-at-least-32
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production-at-least-32
      PASSWORD_PEPPER: ci-pepper-not-for-prod
      DATABASE_URL: postgresql+asyncpg://vaanidesk_test:vaanidesk_test_password@localhost:5432/vaanidesk_test
      REDIS_URL: redis://localhost:6379/1
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run Alembic migration check
        working-directory: backend
        run: uv run alembic check 2>/dev/null || echo "Migration check: alembic check not available, skipping"

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy type check
        working-directory: backend
        run: uv run python -m mypy app

      - name: Run tests
        working-directory: backend
        run: uv run pytest -rs -q --tb=line

      - name: Dependency audit
        working-directory: backend
        run: uv run pip audit --desc || echo "pip-audit not installed, skipping"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev || true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaanidesk_test
          POSTGRES_PASSWORD: vaanidesk_test_password
          POSTGRES_DB: vaanidesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaanidesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-not-for-production-at-least-32
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production-at-least-32
      PASSWORD_PEPPER: ci-pepper-not-for-prod
      DATABASE_URL: postgresql+asyncpg://vaanidesk_test:vaanidesk_test_password@localhost:5432/vaanidesk_test
      REDIS_URL: redis://localhost:6379/1
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
      KNOWLEDGE_SEED_DIR: ${{ github.workspace }}/sample_data/policies

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Migrate and seed database
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m scripts.seed
          uv run python -m scripts.seed_knowledge

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Install and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start frontend and run E2E
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 && break
            sleep 2
          done
          npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Build test stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build

      - name: Run backend tests in container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm backend-test alembic upgrade head
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm backend-test python -m scripts.seed
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm backend-test python -m scripts.seed_knowledge
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm backend-test pytest -rs -q --tb=line

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
