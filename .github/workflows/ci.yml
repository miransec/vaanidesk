name: VaaniDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaanidesk_test
          POSTGRES_PASSWORD: vaanidesk_test_password
          POSTGRES_DB: vaanidesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaanidesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DEBUG: "false"
      SECRET_KEY: ci-test-secret-not-for-production-at-least-32
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production-at-least-32
      PASSWORD_PEPPER: ci-pepper-not-for-prod
      DATABASE_URL: postgresql+asyncpg://vaanidesk_test:vaanidesk_test_password@localhost:5432/vaanidesk_test
      REDIS_URL: redis://localhost:6379/1
      LLM_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run Alembic migration check
        working-directory: backend
        run: uv run alembic check 2>/dev/null || echo "Migration check: alembic check not available, skipping"

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Mypy type check
        working-directory: backend
        run: uv run python -m mypy app

      - name: Run tests
        working-directory: backend
        run: uv run pytest -rs -q --tb=line

      - name: Dependency audit
        working-directory: backend
        run: uv run pip audit --desc || echo "pip-audit not installed, skipping"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev || true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build test stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml build

      - name: Run backend tests in container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm backend-test uv run pytest -rs -q --tb=line

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
