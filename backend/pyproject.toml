[project]
name = "vaanidesk-backend"
version = "0.1.0"
description = "VaaniDesk FastAPI backend — Phase 1 foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<0.120.0",
  "uvicorn[standard]>=0.32.0,<0.35.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
  "asyncpg>=0.30.0,<0.31.0",
  "alembic>=1.14.0,<1.16.0",
  "pgvector>=0.3.6,<0.4.0",
  "redis>=5.2.0,<6.0.0",
  "httpx>=0.28.0,<0.29.0",
  "python-multipart>=0.0.17,<0.1.0",
  "orjson>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.26.0",
  "ruff>=0.8.0,<0.10.0",
  "mypy>=1.13.0,<1.15.0",
  "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []
mypy_path = "."
packages = ["app"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*"]
ignore_missing_imports = true
